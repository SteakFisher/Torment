name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start Postgres, TigerBeetle and RabbitMQ
        run: docker compose up -d --wait
      - name: Generated code is up to date
        run: make generate && git diff --exit-code
      - name: Formatted
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: make test
      - name: Start the API and the exporter
        run: |
          make run > api.log 2>&1 &
          make cdc > cdc.log 2>&1 &
          for _ in $(seq 120); do curl -sf localhost:8080/healthz && exit 0; sleep 1; done
          exit 1
      - run: make e2e
      - run: make brokerage
      - name: Logs
        if: failure()
        run: |
          cat api.log cdc.log || true
          docker compose logs

  docs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
